<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Julius-Leber-Platz – geografisch ausgerichtete visuelle Referenz</title>
  <desc id="desc">Nordorientierte Planungsskizze im Raster des bestehenden GBA-Ausschnitts. Sie unterscheidet belegte Geometrie von interpretierten Baumzellen und Fassadendetails.</desc>
  <defs>
    <pattern id="grid" width="11" height="11" patternUnits="userSpaceOnUse">
      <path d="M 11 0 L 0 0 0 11" fill="none" stroke="#d8dde3" stroke-width="0.55"/>
    </pattern>
    <style>
      .label{font:600 14px system-ui,sans-serif;fill:#18212b}.small{font:12px system-ui,sans-serif;fill:#33404d}
      .tiny{font:10px system-ui,sans-serif;fill:#44515e}.head{font:700 24px system-ui,sans-serif;fill:#12202c}
      .sub{font:14px system-ui,sans-serif;fill:#52606d}.b{stroke:#176b55;stroke-width:2}.i{stroke:#bd6b17;stroke-width:2;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f5ef"/>
  <text x="42" y="39" class="head">Julius-Leber-Platz · Referenzplanung</text>
  <text x="42" y="62" class="sub">Norden oben · 1 Rasterzelle = 2 m · Ausschnitt über beide 64×64-GBA-Karten</text>

  <!-- Map frame: global cells x=12..82, y=0..55 -->
  <g transform="translate(42 88)">
    <rect x="0" y="0" width="770" height="605" rx="4" fill="#eef1ed" stroke="#88939e"/>
    <rect x="0" y="0" width="770" height="605" fill="url(#grid)"/>
    <line x1="572" y1="0" x2="572" y2="605" stroke="#9253a1" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="527" y="18" class="tiny">Kartengrenze x=64</text>

    <!-- Exact OSM building footprints, simplified only by GBA-scale display -->
    <path d="M208 113 L111 113 L111 141 L98 141 L98 181 L208 181 Z" fill="#d5c2a5" class="b"/>
    <path d="M208 181 L296 181 L296 44 L224 44 L224 113 L208 113 Z" fill="#d5c2a5" class="b"/>
    <path d="M43 447 L66 447 L66 442 L81 442 L81 447 L94 447 L94 442 L107 442 L107 447 L132 447 L131 517 L42 516 Z" fill="#d5c2a5" class="b"/>
    <path d="M220 566 L220 556 L211 556 L212 465 L220 465 L220 457 L260 458 L260 465 L278 478 L290 479 L290 507 L297 514 L290 521 L290 535 L297 542 L290 550 L290 566 Z" fill="#d5c2a5" class="b"/>

    <!-- East-side retail footprints -->
    <path d="M535 0 L713 0 L713 135 L532 135 Z" fill="#b9c9d6" class="b"/>
    <path d="M535 315 L708 315 L708 443 L604 443 L604 466 L536 466 Z" fill="#b9c9d6" class="b"/>
    <text x="557" y="72" class="label">MIX MARKT [B]</text>
    <text x="557" y="385" class="label">NETTO [B]</text>

    <!-- Plaza footprint -->
    <path d="M49 208 L357 210 L357 221 L356 409 L346 409 L346 416 L159 415 L49 414 Z" fill="#e9ddd0" class="b"/>
    <rect x="61" y="220" width="282" height="182" fill="#dfd0c1" opacity=".5"/>
    <text x="129" y="279" class="label">JULIUS-LEBER-PLATZ [B]</text>
    <text x="137" y="298" class="small">rechteckig · vollständig gepflastert</text>

    <!-- Public path hierarchy -->
    <path d="M61 311 L357 311 L522 311" fill="none" stroke="#f8f6ef" stroke-width="22"/>
    <path d="M61 311 L357 311 L522 311" fill="none" stroke="#176b55" stroke-width="2"/>
    <path d="M351 209 L351 415" fill="none" stroke="#f8f6ef" stroke-width="18"/>
    <path d="M351 209 L351 415" fill="none" stroke="#176b55" stroke-width="2"/>
    <text x="176" y="316" class="tiny">öffentliche Ost-West-Querung [B]</text>

    <!-- Twelve chestnut locations: count/ring documented; tile centres interpreted from official map/aerial -->
    <g fill="#4f8b52">
      <circle cx="94" cy="236" r="10" class="i"/><circle cx="94" cy="311" r="10" class="i"/><circle cx="94" cy="385" r="10" class="i"/>
      <circle cx="318" cy="236" r="10" class="i"/><circle cx="318" cy="311" r="10" class="i"/><circle cx="318" cy="385" r="10" class="i"/>
      <circle cx="150" cy="231" r="10" class="i"/><circle cx="206" cy="231" r="10" class="i"/><circle cx="262" cy="231" r="10" class="i"/>
      <circle cx="150" cy="390" r="10" class="i"/><circle cx="206" cy="390" r="10" class="i"/><circle cx="262" cy="390" r="10" class="i"/>
    </g>

    <!-- Tram tracks and staggered platforms -->
    <rect x="368" y="0" width="18" height="246" fill="#d7d1bf" class="b"/>
    <rect x="401" y="246" width="18" height="359" fill="#d7d1bf" class="b"/>
    <line x1="379" y1="0" x2="379" y2="605" stroke="#695f54" stroke-width="4"/>
    <line x1="399" y1="0" x2="399" y2="605" stroke="#695f54" stroke-width="4"/>
    <line x1="379" y1="0" x2="379" y2="605" stroke="#f5f0e6" stroke-width="1" stroke-dasharray="4 7"/>
    <line x1="399" y1="0" x2="399" y2="605" stroke="#f5f0e6" stroke-width="1" stroke-dasharray="4 7"/>
    <text x="424" y="276" class="label" transform="rotate(90 424 276)">Haltestelle OBERREUT ZENTRUM [B]</text>
    <text x="451" y="250" class="small" transform="rotate(90 451 250)">Otto-Wels-Straße / Übergänge [B]</text>

    <!-- Interpretive facade cues -->
    <path d="M103 184 L295 184" class="i" fill="none"/>
    <text x="116" y="157" class="label">WOHNRIEGEL 18/20 [B]</text>
    <text x="116" y="174" class="tiny">4 Geschosse; Fassadenrhythmus [I]</text>
    <path d="M532 140 L713 140 M536 470 L708 470" class="i" fill="none"/>
    <text x="537" y="157" class="tiny">Ladenfront/Schilder [I]</text>

    <!-- Current phase marker -->
    <g fill="none" stroke="#697782" stroke-width="1.5" stroke-dasharray="3 3">
      <circle cx="126" cy="198" r="7"/><circle cx="203" cy="198" r="7"/><circle cx="291" cy="198" r="7"/>
      <circle cx="126" cy="429" r="7"/><circle cx="203" cy="429" r="7"/><circle cx="291" cy="429" r="7"/>
    </g>
    <text x="65" y="452" class="tiny">grau: sechs symbolische Baumgruppen in Phase 1.3</text>

    <!-- Compass and scale -->
    <path d="M730 52 L742 22 L754 52 Z" fill="#12202c"/><line x1="742" y1="49" x2="742" y2="78" stroke="#12202c" stroke-width="2"/>
    <text x="736" y="17" class="label">N</text>
    <line x1="20" y1="575" x2="130" y2="575" stroke="#12202c" stroke-width="4"/>
    <line x1="20" y1="569" x2="20" y2="581" stroke="#12202c" stroke-width="2"/><line x1="130" y1="569" x2="130" y2="581" stroke="#12202c" stroke-width="2"/>
    <text x="46" y="596" class="small">20 m / 10 Zellen</text>
  </g>

  <g transform="translate(840 94)">
    <text x="0" y="0" class="label">Legende</text>
    <line x1="0" y1="25" x2="42" y2="25" class="b"/><text x="54" y="30" class="small">[B] belegt</text>
    <line x1="0" y1="52" x2="42" y2="52" class="i"/><text x="54" y="57" class="small">[I] Interpretation</text>
    <text x="0" y="92" class="label">Belegte Grundlage</text>
    <text x="0" y="118" class="small">• Platzpolygon und Wege</text><text x="0" y="140" class="small">• Gebäudegrundrisse</text>
    <text x="0" y="162" class="small">• zwei Gleise und Bahnsteiglinien</text><text x="0" y="184" class="small">• Mix Markt / Netto</text>
    <text x="0" y="206" class="small">• 12 Rosskastanien im Ring</text>
    <text x="0" y="246" class="label">Bewusste Interpretation</text>
    <text x="0" y="272" class="small">• Baumzentren auf 2-m-Raster</text><text x="0" y="294" class="small">• Fassadenmodule und Schilder</text>
    <text x="0" y="316" class="small">• Breite von Bahnsteig / Übergang</text><text x="0" y="338" class="small">• Farb- und Materialpalette</text>
    <text x="0" y="378" class="label">Erkennungsanker</text>
    <text x="0" y="404" class="small">1. Baumring fasst das Rechteck</text><text x="0" y="426" class="small">2. Platz öffnet sich zur Haltestelle</text>
    <text x="0" y="448" class="small">3. Viergeschossige Wohnfassade</text><text x="0" y="470" class="small">4. Ladenfront jenseits der Gleise</text>
    <text x="0" y="492" class="small">5. Klarer Ost-West-Übergang</text>
    <rect x="0" y="530" width="315" height="94" rx="6" fill="#fff" stroke="#c8ced4"/>
    <text x="14" y="553" class="label">Planungsstatus</text>
    <text x="14" y="576" class="small">Keine Engine-, Karten-, Kollisions-</text>
    <text x="14" y="596" class="small">oder Grafikänderung. Vorlage zur</text>
    <text x="14" y="616" class="small">Freigabe vor der Pixelproduktion.</text>
  </g>
  <text x="42" y="731" class="tiny">Quellen: lokales OSM/GIS-Archiv; Geoportal Karlsruhe (Regiokarte, Luftbild 2022); Stadtlexikon Karlsruhe, Julius-Leber-Platz (Foto/Text 2014).</text>
</svg>
